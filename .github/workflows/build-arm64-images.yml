name: build-arm64-images

# 在 arm64 runner 上原生构建 KubeDoor 的 5 个镜像并推送到 GHCR。
# 上游 Dockerfile 已改成官方多架构基础镜像（python/node/nginx），因此无需 qemu。
on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshot/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm          # 原生 arm64 runner（公开仓库免费）
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: kubedoor-master, dockerfile: src/kubedoor-master/Dockerfile, context: src/kubedoor-master }
          - { image: kubedoor-alarm,  dockerfile: src/kubedoor-alarm/Dockerfile,  context: src/kubedoor-alarm }
          - { image: kubedoor-web,    dockerfile: src/kubedoor-web/Dockerfile,    context: src/kubedoor-web }
          - { image: kubedoor-agent,  dockerfile: src/kubedoor-agent/Dockerfile,  context: . }
          - { image: kubedoor-ai,     dockerfile: src/kubedoor-ai/Dockerfile,     context: . }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: |
            TARGETARCH=arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:2.3.0-arm64
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest-arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
